<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inglés para el mundo real | Cursos</title>
  <link rel="stylesheet" href="estilos-curso.css">
  <style>
    .hidden { display: none !important; }
    .btn-complete.completada {
      background: #2ecc71 !important;
      color: white !important;
    }
  </style>
</head>
<body>

  <div id="auth-loading" class="estado-mensaje">
    <h2>Cargando tu progreso...</h2>
    <p>Verificando sesión con Firebase</p>
  </div>

  <div id="no-auth" class="estado-mensaje hidden">
    <h2>Debes iniciar sesión</h2>
    <p>Para acceder a este curso y guardar tu progreso necesitas estar logueado.</p>
    <a href="../login.html" class="btn btn-primary">Ir a Ingresar</a>
  </div>

  <div id="curso-app" class="hidden">
    <header class="curso-header">
      <a href="../index.html" class="logo">
        <span style="font-size:1.4rem">📚</span>
        <span>Volver a Cursos</span>
      </a>
      <div class="user-info">
        <span id="user-name">Usuario</span>
        <div class="avatar" id="user-avatar">U</div>
        <button onclick="logout()" class="btn btn-secondary" style="padding:6px 14px;font-size:0.85rem;margin-left:8px;">Salir</button>
      </div>
    </header>

    <div class="curso-container">
      <aside class="sidebar">
        <div class="curso-titulo">Inglés para el mundo real</div>
        <div class="curso-meta">
          <span>⏱️ 12 semanas</span>
          <span>⭐ 4.8</span>
        </div>

        <div class="progress-box">
          <div class="label">
            <span>Tu progreso</span>
            <span id="progress-percent">0%</span>
          </div>
          <div class="progress-bar">
            <div class="fill" id="progress-fill" style="width:0%"></div>
          </div>
        </div>

        <div id="modulos-lista" class="modulos"></div>
      </aside>

      <main class="contenido">
        <div class="contenido-header">
          <div class="breadcrumb" id="breadcrumb">Módulo 1 → Lección 1</div>
          <h1 id="leccion-titulo">Cargando...</h1>
        </div>

        <div class="leccion-body">
          <div id="leccion-contenido"></div>

          <div class="acciones">
            <button id="btn-prev" class="btn btn-secondary" onclick="prevLesson()">← Anterior</button>
            <button id="btn-complete" class="btn btn-primary" onclick="markComplete()">Marcar como completada</button>
            <button id="btn-next" class="btn btn-primary" onclick="nextLesson()">Siguiente lección →</button>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script type="module">
    import { initCourse } from './firebase-curso.js';

    const lessons = [
      {
        modulo: "Módulo 1: Mentalidad y bases para hablar",
        titulo: "Deja de traducir en tu cabeza",
        contenido: `
          <h2>Deja de traducir en tu cabeza</h2>
          <p>El mayor freno para hablar inglés fluidamente es estar traduciendo constantemente del español.</p>

          <h3>El cambio de chip necesario</h3>
          <p>En lugar de pensar “¿cómo se dice esto en inglés?”, empieza a pensar directamente en situaciones y frases completas en inglés.</p>

          <h3>Estrategia práctica</h3>
          <ul>
            <li>Aprende frases enteras, no palabras sueltas.</li>
            <li>Usa el inglés para cosas simples de tu día: “I’m going to make coffee”, “Where are my keys?”.</li>
            <li>Cuando no sepas una palabra, descríbela en inglés en lugar de volver al español.</li>
          </ul>

          <div class="tip">
            <strong>💡 Ejercicio diario (5 min):</strong> Describe en voz alta lo que estás haciendo en este momento usando solo inglés. Aunque sea básico.
          </div>
        `
      },
      {
        modulo: "Módulo 1: Mentalidad y bases para hablar",
        titulo: "Los 300 bloques de construcción más útiles",
        contenido: `
          <h2>Los 300 bloques de construcción más útiles</h2>
          <p>No necesitas 10.000 palabras para comunicarte bien. Necesitas los bloques correctos y saber combinarlos.</p>

          <h3>Categorías prioritarias</h3>
          <ol>
            <li>Saludos y presentaciones.</li>
            <li>Pedir y dar información básica.</li>
            <li>Expresar opiniones y preferencias.</li>
            <li>Hablar del pasado reciente y planes futuros.</li>
            <li>Manejar malentendidos (“Sorry, can you repeat that?”).</li>
          </ol>

          <h3>Técnica de aprendizaje</h3>
          <p>Por cada frase nueva:</p>
          <ul>
            <li>Escúchala y repítela en voz alta 5 veces.</li>
            <li>Escríbela.</li>
            <li>Úsala en una frase personal relacionada contigo.</li>
            <li>Repásala al día siguiente (repetición espaciada).</li>
          </ul>

          <div class="importante">
            <strong>📌 Meta de las primeras 4 semanas:</strong> Poder mantener una conversación simple de 3-4 minutos sobre ti, tu trabajo/estudios y tu día.
          </div>
        `
      },
      {
        modulo: "Módulo 2: Conversación en situaciones reales",
        titulo: "Presentarte y mantener una conversación casual",
        contenido: `
          <h2>Presentarte y mantener una conversación casual</h2>
          <p>La mayoría de las interacciones empiezan con presentaciones y small talk.</p>

          <h3>Estructura de una presentación efectiva</h3>
          <ul>
            <li>Nombre + origen o ciudad.</li>
            <li>Qué haces (trabajo o estudios).</li>
            <li>Un detalle interesante o actual (opcional pero recomendado).</li>
          </ul>

          <h3>Frases para mantener la conversación viva</h3>
          <ul>
            <li>“How about you?”</li>
            <li>“That’s interesting. Tell me more about…”</li>
            <li>“Really? What was that like?”</li>
            <li>“I know what you mean.”</li>
          </ul>

          <div class="tip">
            <strong>💡 Regla de oro del small talk:</strong> Haz más preguntas de las que das respuestas. A la gente le gusta hablar de sí misma.
          </div>
        `
      },
      {
        modulo: "Módulo 2: Conversación en situaciones reales",
        titulo: "En el trabajo y entornos profesionales",
        contenido: `
          <h2>En el trabajo y entornos profesionales</h2>
          <p>El inglés profesional no tiene que ser complicado. Tiene que ser claro y cortés.</p>

          <h3>Situaciones clave a dominar</h3>
          <ul>
            <li>Presentar una idea en una reunión.</li>
            <li>Pedir clarificación sin parecer inseguro.</li>
            <li>Dar y recibir feedback.</li>
            <li>Escribir correos cortos y efectivos.</li>
            <li>Participar en videollamadas.</li>
          </ul>

          <h3>Frases de alto valor</h3>
          <ul>
            <li>“Just to make sure I understand…”</li>
            <li>“Would it be possible to…?”</li>
            <li>“I see your point, however…”</li>
            <li>“Let me get back to you on that.”</li>
          </ul>

          <div class="importante">
            <strong>📌 Consejo:</strong> En contextos profesionales, es mejor ser un poco más formal al principio y luego adaptar el tono según la cultura del equipo.
          </div>
        `
      },
      {
        modulo: "Módulo 3: Comprensión y oído",
        titulo: "Entrenar el oído (listening real)",
        contenido: `
          <h2>Entrenar el oído (listening real)</h2>
          <p>Entender inglés hablado a velocidad normal es uno de los mayores retos… y también uno de los más entrenables.</p>

          <h3>Método progresivo</h3>
          <ol>
            <li>Empieza con contenido para learners (con subtítulos en inglés).</li>
            <li>Pasa a contenido auténtico con subtítulos en inglés.</li>
            <li>Finalmente, sin subtítulos.</li>
          </ol>

          <h3>Técnica de “shadowing”</h3>
          <p>Escucha una frase corta y repítela inmediatamente intentando imitar el ritmo, la entonación y la pronunciación. Es una de las técnicas más efectivas que existen.</p>

          <div class="tip">
            <strong>💡 Recursos recomendados:</strong> Podcasts lentos al principio (Coffee Break English, ESL Pod), luego series con inglés claro (The Office, Friends, TED Talks).
          </div>
        `
      },
      {
        modulo: "Módulo 3: Comprensión y oído",
        titulo: "Pensar y responder en tiempo real",
        contenido: `
          <h2>Pensar y responder en tiempo real</h2>
          <p>La fluidez no es hablar perfecto. Es poder mantener el flujo de la conversación aunque cometas errores.</p>

          <h3>Estrategias cuando no sabes una palabra</h3>
          <ul>
            <li>Descríbela: “It’s the thing you use to…”</li>
            <li>Usa un sinónimo más simple.</li>
            <li>Pregunta: “How do you say…?”</li>
            <li>Sigue adelante y vuelve después si es importante.</li>
          </ul>

          <h3>Ejercicio de fluidez</h3>
          <p>Pon un temporizador de 60-90 segundos y habla sin parar sobre un tema simple (tu comida favorita, tu fin de semana, un problema actual). El objetivo no es la precisión, es no quedarte en silencio.</p>

          <div class="importante">
            <strong>📌 Mentalidad clave:</strong> Los errores son información, no fracaso. Cada error te muestra exactamente qué necesitas practicar.
          </div>
        `
      },
      {
        modulo: "Módulo 4: Sistema de mejora continua",
        titulo: "Tu plan de 12 semanas y más allá",
        contenido: `
          <h2>Tu plan de 12 semanas y más allá</h2>
          <p>La consistencia vence a la intensidad. Mejor 25 minutos diarios que 3 horas un solo día.</p>

          <h3>Estructura semanal recomendada</h3>
          <ul>
            <li><strong>4-5 días</strong>: práctica activa (hablar + escribir).</li>
            <li><strong>5-6 días</strong>: input (listening + lectura ligera).</li>
            <li><strong>1 día</strong>: revisión de lo aprendido esa semana.</li>
          </ul>

          <h3>Indicadores de progreso reales</h3>
          <ul>
            <li>Puedes mantener una conversación de 5+ minutos sin cambiar a español.</li>
            <li>Entiendes la idea principal de videos o podcasts sin subtítulos.</li>
            <li>Escribes mensajes de WhatsApp o correos sin traducir palabra por palabra.</li>
          </ul>

          <div class="tip">
            <strong>🎯 Siguiente nivel:</strong> Busca intercambios de idioma, comunidades online o tutores para tener conversaciones reales. El aula y los ejercicios preparan; la conversación real consolida.
          </div>
        `
      }
    ];

    initCourse("ingles-mundo-real", lessons);
  </script>
</body>
</html>
